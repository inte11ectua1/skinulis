name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.5"
          python-version: "3.12.15"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: lint
      - run: uv python install 3.12.15
      - run: uv sync --frozen
      - run: uv lock --check
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv pip check
      - run: uv audit --locked
      - run: uv run pre-commit run detect-secrets --all-files

  types:
    name: types
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.5"
          python-version: "3.12.15"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: types
      - run: uv python install 3.12.15
      - run: uv sync --frozen
      - run: uv lock --check
      - run: uv run mypy .

  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
        env:
          POSTGRES_USER: skinulis_test
          POSTGRES_DB: skinulis_test
          # Public credential for this disposable, loopback-only CI service.
          POSTGRES_PASSWORD: skinulis-ci-only # pragma: allowlist secret (public disposable test credential)
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U skinulis_test -d skinulis_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+psycopg://skinulis_test:skinulis-ci-only@127.0.0.1:5432/skinulis_test # pragma: allowlist secret (same public test credential)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.5"
          python-version: "3.12.15"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: tests
      - run: uv python install 3.12.15
      - run: uv sync --frozen
      - run: uv lock --check
      - name: Unit tests (app, finance, bot)
        run: uv run coverage run -m pytest
      - name: Integration tests (real PostgreSQL 17)
        run: uv run coverage run --append -m pytest -m integration
      - name: Combined branch coverage (app + bot, minimum 60%)
        run: |
          uv run coverage report --precision=2 --fail-under=60 | tee coverage.txt
          uv run coverage xml
          cat coverage.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage.xml
            coverage.txt
          if-no-files-found: error
          retention-days: 14

  docker-build:
    name: docker-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build existing Dockerfile (no push)
        run: docker build --pull --progress=plain --tag "skinulis-ci:$GITHUB_SHA" .

  ci:
    name: ci
    if: ${{ always() }}
    needs: [lint, types, tests, docker-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          LINT: ${{ needs.lint.result }}
          TYPES: ${{ needs.types.result }}
          TESTS: ${{ needs.tests.result }}
          DOCKER_BUILD: ${{ needs.docker-build.result }}
        run: |
          [[ "$LINT" == success ]]
          [[ "$TYPES" == success ]]
          [[ "$TESTS" == success ]]
          [[ "$DOCKER_BUILD" == success ]]
