minimum_pre_commit_version: "4.4.0"
repos:
  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv lock check
        entry: uv lock --check
        language: unsupported
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check
        language: unsupported
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format --check
        language: unsupported
        types_or: [python, pyi]
      - id: mypy
        name: mypy strict
        entry: uv run --locked mypy .
        language: unsupported
        pass_filenames: false
        always_run: true
      - id: detect-secrets
        name: Detect secrets (including text lockfiles)
        # pre-commit selects text files; detect-secrets otherwise skips .lock files.
        entry: >-
          uv run --locked detect-secrets-hook --no-verify
          --disable-filter detect_secrets.filters.heuristic.is_non_text_file
        language: unsupported
        types: [text]
