# Separate from local compose.yaml. Use scripts/deployment.py and an explicit env file.
x-logging: &logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "3"
    compress: "true"

x-app: &app
  image: ${APP_IMAGE:?Use a verified ghcr.io image@sha256 digest}
  init: true
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: *logging

x-db-env: &db-env
  APP_ENV: prod
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}

services:
  db:
    image: postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
    logging: *logging
    # No query/bind/detail diagnostics containing user data on ordinary SQL errors.
    command: [postgres, -c, log_statement=none, -c, log_min_messages=fatal, -c, log_min_error_statement=panic, -c, log_error_verbosity=terse, -c, log_parameter_max_length=0, -c, log_parameter_max_length_on_error=0]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [database]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app
    command: [python, -m, app.core.migrate]
    environment: *db-env
    networks: [database]
    restart: "no"
    depends_on:
      db: {condition: service_healthy}

  api:
    <<: *app
    environment:
      <<: *db-env
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
      BOT_SERVICE_TOKEN: ${BOT_SERVICE_TOKEN:?Set BOT_SERVICE_TOKEN}
      JWT_ACCESS_TOKEN_TTL_MINUTES: ${JWT_ACCESS_TOKEN_TTL_MINUTES:-15}
    networks: [application, database]
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=4).close()"]
      interval: 5s
      timeout: 5s
      retries: 12

  bot:
    <<: *app
    profiles: [polling]
    # Fixed project-specific name makes Compose --scale bot=2 fail explicitly.
    container_name: ${COMPOSE_PROJECT_NAME:?Set stable COMPOSE_PROJECT_NAME}-bot
    command: [python, -m, bot.main]
    environment:
      API_BASE_URL: http://api:8000
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      BOT_SERVICE_TOKEN: ${BOT_SERVICE_TOKEN:?Set BOT_SERVICE_TOKEN}
    networks: [application, telegram]
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    deploy: {replicas: 1}
    # Process health only; a live Telegram delivery check is a separate gate.
    healthcheck:
      test: [CMD, python, -c, "from pathlib import Path; assert any(p.read_bytes().split(bytes([0]))[1:3] == [b'-m', b'bot.main'] for p in Path('/proc').glob('[0-9]*/cmdline'))"]
      interval: 15s
      timeout: 3s
      retries: 3

  caddy:
    image: caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    user: "10001:10001"
    logging: *logging
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, application]
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'wget -q --spider "https://$$PUBLIC_DOMAIN/health"']
      interval: 15s
      timeout: 5s
      retries: 12

networks:
  edge: {}
  telegram: {}
  application: {internal: true}
  database: {internal: true}

# Pre-created by the operator; a typo must fail instead of silently starting an empty DB.
volumes:
  postgres_data:
    external: true
    name: ${POSTGRES_VOLUME:?Set existing POSTGRES_VOLUME}
  caddy_data:
    external: true
    name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}-caddy-data
  caddy_config:
    external: true
    name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}-caddy-config
