# Disposable PostgreSQL for local integration tests; never uses the app's volume.
services:
  db-test:
    image: postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
    environment:
      POSTGRES_DB: skinulis_test
      POSTGRES_USER: skinulis_test
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?Use scripts/test_integration.py}
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skinulis_test -d skinulis_test"]
      interval: 2s
      timeout: 3s
      retries: 30
