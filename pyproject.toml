[project]
name = "skinulis"
version = "0.1.0"
description = "Учебный сервис совместных расходов"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1,<2.0.0",
    "fastapi>=0.162.0,<0.163.0",
    "psycopg[binary]>=3,<4",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "sqlalchemy>=2,<3",
    "uvicorn>=0.54.0,<0.55.0",
]

[tool.uv]
required-version = "==0.13.5"
package = false

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ['^\.venv/']

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib", "-m", "not integration"]
markers = ["integration: requires an explicitly configured disposable PostgreSQL 17"]

[tool.coverage.run]
branch = true
source = ["app", "bot"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 60

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0,<2.0.0",
    "httpx>=0.28.1,<0.29.0",
    "mypy>=2.4.0,<3.0.0",
    "pre-commit>=4.7.0,<5.0.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "ruff>=0.17.1,<0.18.0",
]
